<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pendências</title>
    <th:block th:insert="fragments/interface :: headTag"></th:block>
    <style th:insert="fragments/interface :: css"></style>
</head>
<body>
<div class="container-fluid text-center">
    <div th:insert="fragments/interface :: menu"></div>

    <div>
        <h1>Pendências</h1>
    </div>

    <div th:insert="fragments/interface :: mensagens"></div>

    <div>
        <h1 th:if="${pendencias.size()} == 0">Não foram encontrados arquivos de pendências</h1>
        <table id="tabela1" class="table table-bordered" th:if="${pendencias.size()} > 0">
            <thead class="thead-dark">
            <tr>
                <th onclick="clicar(0, 'tabela1')" class="text-center">ID automação<br><input type="number" id="input1" onkeyup="pesquisar()" placeholder="Pesquisar" class="form-control"></th>
                <th onclick="clicar(1, 'tabela1')" class="text-center">Nome<br><input type="text" id="input2" onkeyup="pesquisar()" placeholder="Pesquisar" class="form-control"></th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="pendencia : ${pendencias}">
                <tr>
                    <td>[[${pendencia.automacao.id}]]</td>
                    <td>[[${pendencia.nomeArquivo}]]</td>
                    <td>
                        <a class="btn btn-primary" th:href="@{'/pendencias/baixararquivo/' + ${pendencia.automacao.id} + '/' + ${pendencia.nomeArquivo}}">Download</a>
                        <a class="btn btn-primary" th:href="@{'/pendencias/excluirarquivo/' + ${pendencia.automacao.id} + '/' + ${pendencia.nomeArquivo}}">Excluir</a>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>
</div>

<div th:insert="fragments/interface :: alterarSenha"></div>

<div th:insert="fragments/interface :: pesquisarTabela"></div>
<div th:insert="fragments/interface :: ordenarTabela"></div>
</body>
</html>
