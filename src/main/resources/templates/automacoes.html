<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Automações</title>
    <th:block th:insert="fragments/interface :: headTag"></th:block>
    <style th:insert="fragments/interface :: css"></style>
</head>
<body>
<div class="container-fluid text-center">
    <div th:insert="fragments/interface :: menu"></div>

    <div>
        <h1 id="infos" th:link="${link}" th:context-path="${contextPath}">Automações</h1>
    </div>

    <div th:if="${param.acessonegado}" class="alert alert-warning alert-dismissible text-center" role="alert">
        <span type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></span>
        Sua conta não tem acesso a esse serviço
    </div>

    <div th:insert="fragments/interface :: mensagens"></div>

    <div class="m-2">
        <input type="checkbox" id="ativos" th:checked="${ativos}"><label for="ativos" class="m-2">Ativas</label>
    </div>

    <div>
        <h1 th:if="${automacoes.size()} == 0">Não foram encontradas automações cadastradas</h1>
        <table class="table table-bordered" th:if="${automacoes.size()} > 0">
            <thead class="thead-dark">
            <tr>
                <th class="text-center">ID</th>
                <th class="text-center">Nome</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <th:block th:each="automacao : ${automacoes}">
                <tr>
                    <td>[[${automacao.id}]]</td>
                    <td>[[${automacao.nome}]]</td>
                    <td>
                        <a class="btn btn-primary" th:href="@{'/automacoes/consultar/' + ${automacao.id}}">Consultar</a>
                        <a th:if="${automacao.ativo}" class="btn btn-primary" th:href="@{'/automacoes/ativotoggle/' + ${automacao.id}}">Inativar</a>
                        <a th:if="${!automacao.ativo}" class="btn btn-primary" th:href="@{'/automacoes/ativotoggle/' + ${automacao.id}}">Ativar</a>
                        <a th:if="${adm}" class="btn btn-primary" th:href="@{'/automacoes/excluir/' + ${automacao.id}}">Excluir</a>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>
</div>

<div th:insert="fragments/interface :: alterarSenha"></div>

<script>
    $(document).ready(function () {
        $("#ativos").click(function () {
            if ($(this).is(":checked")) {
                window.location.replace("http://" + document.getElementById("infos").getAttribute("link") + document.getElementById("infos").getAttribute("context-path") + "/automacoes/true");
            } else {
                window.location.replace("http://" + document.getElementById("infos").getAttribute("link") + document.getElementById("infos").getAttribute("context-path") + "/automacoes/false");
            }
        });
    });
</script>
</body>
</html>
