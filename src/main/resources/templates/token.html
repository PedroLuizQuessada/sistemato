<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>[[${tituloPagina}]]</title>
  <th:block th:insert="fragments/interface :: headTag"></th:block>
  <style th:insert="fragments/interface :: css"></style>
</head>
<body>
<div class="container-fluid text-center">
  <div th:insert="fragments/interface :: menu"></div>

  <div>
    <h1>[[${tituloPagina}]]</h1>
  </div>

  <div th:insert="fragments/interface :: mensagens"></div>

  <form th:action="@{/tokens/salvar}" method="post" th:object="${token}" style="max-width: 500px; margin: 0 auto">
    <div class="border border-secondary rounded p-3">
      <input id="id" type="hidden" th:field="*{id}">
      <div class="form-group row">
        <label class="col-sm-4 col-form-label" for="nome">Nome:</label>
        <div class="col-sm-8">
          <input id="nome" type="text" th:field="*{nome}" class="form-control" required maxlength="45"/>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-4 col-form-label" for="codigo" th:if="${token.getCodigo() != null}">Código:</label>
        <div class="col-sm-8">
          <input style="resize: none;" id="codigo" type="text" th:field="*{codigo}" th:if="${token.getCodigo() != null}" class="form-control" readonly>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-4 col-form-label" for="ativo">Ativo:</label>
        <div class="col-sm-8">
          <input id="ativo" type="checkbox" th:field="*{ativo}"/>
        </div>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-primary m-2">Salvar</button>
      </div>
    </div>
    <label></label>
  </form>
</div>

<div th:insert="fragments/interface :: alterarSenha"></div>
</body>
</html>
