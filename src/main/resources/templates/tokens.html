<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <link rel="shortcut icon" type="image/png" th:href="@{/img/favicon.png}"/>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <title>Tokens</title>
</head>
<body>
<div class="container-fluid text-center">
  <label></label>
  <div>
    <form th:action="@{/logout}" method="post">
      <input class="btn btn-danger" style="margin-right: 90%" type="submit" value="Deslogar">
    </form>
  </div>

  <div class="m-2">
    <a class="btn btn-primary" style="margin-right: 90%; margin-top: 1%" th:href="@{/voltar/tokens}">Voltar</a>
    <br>
    <a class="btn btn-primary" style="margin-right: 90%; margin-top: 1%" th:href="@{/tokens/novo}">Adicionar token</a>
  </div>

  <div>
    <h1 id="infos" th:link="${link}" th:context-path="${contextPath}">Tokens</h1>
  </div>

  <!--/*@thymesVar id="mensagemSucesso" type="java.lang.String"*/-->
  <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible text-center" role="alert">
    <span type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></span>
    [[${mensagemSucesso}]]
  </div>

  <!--/*@thymesVar id="mensagemErro" type="java.lang.String"*/-->
  <div th:if="${mensagemErro}" class="alert alert-warning alert-dismissible text-center" role="alert">
    <span type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></span>
    [[${mensagemErro}]]
  </div>

  <div class="m-2">
    <input type="checkbox" id="ativos" th:checked="${ativos}"><label for="ativos" class="m-2">Ativos</label>
  </div>

  <div>
    <h1 th:if="${tokens.size()} == 0">Não foram encontrados tokens cadastrados</h1>
    <table class="table table-bordered" th:if="${tokens.size()} > 0">
      <thead class="thead-dark">
      <tr>
        <th class="text-center">Nome</th>
        <th class="text-center">Código</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <th:block th:each="token : ${tokens}">
        <tr>
          <td>[[${token.nome}]]</td>
          <td>[[${token.codigo}]]</td>
          <td>
            <a class="btn btn-primary" th:href="@{'/tokens/consultar/' + ${token.id}}">Consultar</a>
            <a th:if="${token.ativo}" class="btn btn-primary" th:href="@{'/tokens/ativotoggle/' + ${token.id}}">Inativar</a>
            <a th:if="${!token.ativo}" class="btn btn-primary" th:href="@{'/tokens/ativotoggle/' + ${token.id}}">Ativar</a>
            <a class="btn btn-primary" th:href="@{'/tokens/excluir/' + ${token.id}}">Excluir</a>
          </td>
        </tr>
      </th:block>
      </tbody>
    </table>
  </div>
</div>

<script>
  $(document).ready(function () {
    $("#ativos").click(function () {
      if ($(this).is(":checked")) {
        window.location.replace("http://" + document.getElementById("infos").getAttribute("link") + document.getElementById("infos").getAttribute("context-path") + "/tokens/true");
      } else {
        window.location.replace("http://" + document.getElementById("infos").getAttribute("link") + document.getElementById("infos").getAttribute("context-path") + "/tokens/false");
      }
    });
  });
</script>
</body>
</html>
