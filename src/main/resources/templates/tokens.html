<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Tokens</title>
  <th:block th:insert="fragments/interface :: headTag"></th:block>
  <style th:insert="fragments/interface :: css"></style>
</head>
<body>
<div class="container-fluid text-center">
  <div th:insert="fragments/interface :: menu"></div>

  <div>
    <h1 id="infos" th:link="${link}" th:context-path="${contextPath}">Tokens</h1>
  </div>

  <div th:insert="fragments/interface :: mensagens"></div>

  <div class="m-2">
    <input type="checkbox" id="ativos" th:checked="${ativos}"><label for="ativos" class="m-2">Ativos</label>
  </div>

  <div>
    <h1 th:if="${tokens.size()} == 0">Não foram encontrados tokens cadastrados</h1>
    <table id="tabela1" class="table table-bordered" th:if="${tokens.size()} > 0">
      <thead class="thead-dark">
      <tr>
        <th onclick="clicar(0, 'tabela1')" class="text-center">Nome<br><input type="text" id="input1" onkeyup="pesquisar()" placeholder="Pesquisar" class="form-control"></th>
        <th onclick="clicar(1, 'tabela1')" class="text-center">Código<br><input type="text" id="input2" onkeyup="pesquisar()" placeholder="Pesquisar" class="form-control"></th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <th:block th:each="token : ${tokens}">
        <tr>
          <td>[[${token.nome}]]</td>
          <td>[[${token.codigo}]]</td>
          <td>
            <a class="btn btn-primary" th:href="@{'/tokens/consultar/' + ${token.id}}">Consultar</a>
            <a th:if="${token.ativo}" class="btn btn-primary" th:href="@{'/tokens/ativotoggle/' + ${token.id}}">Inativar</a>
            <a th:if="${!token.ativo}" class="btn btn-primary" th:href="@{'/tokens/ativotoggle/' + ${token.id}}">Ativar</a>
            <a class="btn btn-primary" th:href="@{'/tokens/excluir/' + ${token.id}}">Excluir</a>
          </td>
        </tr>
      </th:block>
      </tbody>
    </table>
  </div>
</div>

<div th:insert="fragments/interface :: alterarSenha"></div>

<script>
  $(document).ready(function () {
    $("#ativos").click(function () {
      if ($(this).is(":checked")) {
        window.location.replace("http://" + document.getElementById("infos").getAttribute("link") + document.getElementById("infos").getAttribute("context-path") + "/tokens/true");
      } else {
        window.location.replace("http://" + document.getElementById("infos").getAttribute("link") + document.getElementById("infos").getAttribute("context-path") + "/tokens/false");
      }
    });
  });
</script>

<div th:insert="fragments/interface :: pesquisarTabela"></div>
<div th:insert="fragments/interface :: ordenarTabela"></div>
</body>
</html>
