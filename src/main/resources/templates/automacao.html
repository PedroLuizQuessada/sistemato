<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="shortcut icon" type="image/png" th:href="@{/img/favicon.png}"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <script src="https://code.jquery.com/jquery-3.4.1.js"></script>
    <title>[[${tituloPagina}]]</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Open Sans", sans-serif;
        }
        .menu-container{
            position: absolute;
            top: 5%;
            left: 85%;
            transform: translate(-50%, -50%);
            width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button{
            position: relative;
            background: #1b1b1b;
            color: white;
            font-size: 20px;
            padding: 8px 20px;
            width: 150px;
            line-height: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 25px;
            cursor: pointer;
            transition: width .4s;
        }
        .button.expand{
            width: 100%;
        }
        ul{
            list-style: none;
            position: absolute;
            top: 65px;
            background: #1b1b1b;
            width: 100%;
            text-align: center;
            border-radius: 5px;
            display: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        ul:before{
            position: absolute;
            content: '';
            width: 20px;
            height: 20px;
            background: #1b1b1b;
            top: -10px;
            right: 15px;
            transform: rotate(45deg);
            z-index: -1;
        }
        ul li{
            line-height: 35px;
            padding: 8px 20px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: 1px solid rgba(255,255,255,.1);
        }
        ul li:last-child{
            border-bottom: none;
        }
        ul li a{
            color: white;
            font-size: 18px;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container-fluid text-center">
    <div class="menu-container">
        <div class="button">
            Menu
            <span class="fas fa-bars"></span>
        </div>
        <ul>
            <li><a style="text-decoration: none;" th:href="@{'/automacoes/true'}">Automações</a></li>
            <li><a style="text-decoration: none;" th:href="@{/usuarios}">Usuários</a></li>
            <li><a style="text-decoration: none;" th:href="@{'/tokens/true'}">Tokens</a></li>
            <li><a style="text-decoration: none;" href="#" data-toggle="modal" data-target="#alterarSenha">Alterar senha</a></li>
            <li>
                <form th:action="@{/logout}" method="post">
                    <input style="color: white; font-size: 18px; background: #1b1b1b; border: #1b1b1b;" type="submit" value="Deslogar">
                </form>
            </li>
        </ul>
    </div>

    <div>
        <h1>[[${tituloPagina}]]</h1>
    </div>

    <!--/*@thymesVar id="mensagemErro" type="java.lang.String"*/-->
    <div th:if="${mensagemErro}" class="alert alert-warning alert-dismissible text-center" role="alert">
        <span type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></span>
        [[${mensagemErro}]]
    </div>

    <form th:action="@{/automacoes/salvar}" method="post" th:object="${automacao}" style="max-width: 500px; margin: 0 auto">
        <div class="border border-secondary rounded p-3">
            <input id="id" type="hidden" th:field="*{id}">
            <div class="form-group row">
                <label class="col-sm-4 col-form-label" for="nome">Nome:</label>
                <div class="col-sm-8">
                    <input id="nome" type="text" th:field="*{nome}" class="form-control" required minlength="2" maxlength="45"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label" for="descricao">Descrição:</label>
                <div class="col-sm-8">
                    <textarea style="resize: none;" id="descricao" type="text" th:field="*{descricao}" class="form-control" maxlength="255"></textarea>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label" for="ativo">Ativo:</label>
                <div class="col-sm-8">
                    <input id="ativo" type="checkbox" th:field="*{ativo}"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label">Dias de execução:</label>
                <div class="col-sm-8">
                    <label class="col-sm-4 col-form-label" for="domingo">Domingo</label>
                    <input id="domingo" type="checkbox" th:field="*{domingo}"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label"></label>
                <div class="col-sm-8">
                    <label class="col-sm-4 col-form-label" for="segunda">Segunda</label>
                    <input id="segunda" type="checkbox" th:field="*{segunda}"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label"></label>
                <div class="col-sm-8">
                    <label class="col-sm-4 col-form-label" for="terca">Terça</label>
                    <input id="terca" type="checkbox" th:field="*{terca}"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label"></label>
                <div class="col-sm-8">
                    <label class="col-sm-4 col-form-label" for="quarta">Quarta</label>
                    <input id="quarta" type="checkbox" th:field="*{quarta}"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label"></label>
                <div class="col-sm-8">
                    <label class="col-sm-4 col-form-label" for="quinta">Quinta</label>
                    <input id="quinta" type="checkbox" th:field="*{quinta}"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label"></label>
                <div class="col-sm-8">
                    <label class="col-sm-4 col-form-label" for="sexta">Sexta</label>
                    <input id="sexta" type="checkbox" th:field="*{sexta}"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label"></label>
                <div class="col-sm-8">
                    <label class="col-sm-4 col-form-label" for="sabado">Sábado</label>
                    <input id="sabado" type="checkbox" th:field="*{sabado}"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label" for="horarioInicio">Horário de início:</label>
                <div class="col-sm-8">
                    <input id="horarioInicio" type="text" th:field="*{horarioInicio}" class="form-control" pattern="[0-9]{2}:[0-9]{2}" placeholder="Exemplo: 07:30" title="Exemplo: 07:30"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label" for="horarioFim">Horário fim:</label>
                <div class="col-sm-8">
                    <input id="horarioFim" type="text" th:field="*{horarioFim}" class="form-control" pattern="[0-9]{2}:[0-9]{2}" placeholder="Exemplo: 07:30" title="Exemplo: 07:30"/>
                </div>
            </div>
            <div class="text-center">
                <a class="btn btn-primary" data-toggle="modal" data-target="#consultarLogs" th:if="${automacao.getId() != null}">Consultar logs</a>
                <br>
                <button type="submit" class="btn btn-primary m-2">Salvar</button>
            </div>
        </div>
        <label></label>
    </form>
</div>

<div class="container">
    <div class="modal fade" id="consultarLogs" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content text-center">
                <div class="modal-header text-center">
                    <h4 class="modal-title text-center">Foram encontrados [[${logs.size()}]] logs para essa automação</h4>
                </div>

                <table class="table table-bordered" th:if="${logs.size()} > 0">
                    <thead class="thead-dark">
                    <tr>
                        <th class="text-center">ID</th>
                        <th class="text-center">Hora</th>
                        <th class="text-center">Mensagem</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="log : ${logs}">
                        <tr>
                            <td>[[${log.id}]]</td>
                            <td>[[${log.hora}]]</td>
                            <td>[[${log.mensagem}]]</td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>

                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="modal fade" id="alterarSenha" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content text-center">
                <div class="modal-header text-center">
                    <h4 class="modal-title text-center">Informe sua nova senha</h4>
                </div>
                <form th:action="@{/alterarsenha}" method="post" style="max-width: 350px; margin: 0 auto">
                    <div class="modal-body">
                        <p>
                            <input type="password" name="senha" class="form-control" placeholder="Nova senha" required autofocus minlength="3" maxlength="64">
                        </p>
                    </div>
                    <div class="modal-footer">
                        <input type="submit" value="Alterar" class="btn btn-primary">
                        <button type="button" class="btn btn-default" data-dismiss="modal">Fechar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function(){
        $('.button').click(function(){
            if($(this).hasClass('expand')){
                $('ul').slideUp(function(){
                    $('.button').removeClass('expand');
                    $('.fas').removeClass('expand')
                });
            }else{
                $(this).addClass('expand');
                setTimeout(function(){
                    $('.fas').addClass('expand');
                    $('ul').stop().slideDown();
                },200);
            }
        });
    });
</script>

</body>
</html>
