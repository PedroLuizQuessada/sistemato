<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>[[${tituloPagina}]]</title>
    <th:block th:insert="fragments/interface :: headTag"></th:block>
    <style th:insert="fragments/interface :: css"></style>
</head>
<body>
<div class="container-fluid text-center">
    <div th:insert="fragments/interface :: menu"></div>

    <div>
        <h1>[[${tituloPagina}]]</h1>
    </div>

    <div th:insert="fragments/interface :: mensagens"></div>

    <form th:action="@{/usuarios/salvar}" method="post" th:object="${usuario}" style="max-width: 500px; margin: 0 auto">
        <div class="border border-secondary rounded p-3">
            <input id="id" type="hidden" th:field="*{id}">
            <div class="form-group row">
                <label class="col-sm-4 col-form-label" for="email">E-mail:</label>
                <div class="col-sm-8">
                    <input id="email" type="email" th:field="*{email}" class="form-control" required maxlength="45"/>
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label" for="senha">Senha:</label>
                <div class="col-sm-8">
                    <input style="resize: none;" id="senha" type="password" th:field="*{senha}" class="form-control" minlength="3" maxlength="64">
                </div>
            </div>
            <div class="form-group row">
                <label class="col-sm-4 col-form-label" for="adm" th:if="${usuario.getId() == null || usuario.getId() > 1}">ADM:</label>
                <div class="col-sm-8">
                    <input id="adm" type="checkbox" th:field="*{adm}" th:if="${usuario.getId() == null || usuario.getId() > 1}"/>
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary m-2">Salvar</button>
            </div>
        </div>
        <label></label>
    </form>
</div>

<div th:insert="fragments/interface :: alterarSenha"></div>
</body>
</html>
